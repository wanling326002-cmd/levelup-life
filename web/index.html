      (function () {
        if (!/app\.html$/.test(location.pathname)) {
          if (/[?&](code|state|error)=/.test(location.search)) location.replace("app.html" + location.search + location.hash)
          return
        }
        try { if (sessionStorage.getItem("lu-sw-fix")) return; sessionStorage.setItem("lu-sw-fix", "1") } catch (e) { return }

        if (navigator.serviceWorker) navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister() })) }).then(go, go)
        else go()
      })()
