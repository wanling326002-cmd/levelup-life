# Tests everything and builds the Windows installer.
#  - Every push and pull request: lint, unit tests, website browser tests (Linux), desktop tests and an installer
#    build (Windows). The installer is attached to the run as a download ("Artifacts").
#  - A version tag such as v1.1.0 (it must match "version" in package.json) also publishes a GitHub Release with the
#    installer and update files. Installed apps find it the next time they start and update themselves.
name: Windows app

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # only used to publish releases for version tags

concurrency:
  group: windows-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  website-tests:
    name: Website tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit
      - name: Install the test browser
        run: npx playwright install --with-deps chromium
      - name: Browser test suites
        run: npm run test:web

  windows:
    name: Desktop tests and installer (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests (includes the real Windows process reader)
        run: npm run test:unit
      - name: Desktop end-to-end test (the real app, fake game processes and a fake website)
        run: node tests/desktop/e2e.js
        env:
          LEVELUP_TEST_OUT: ${{ runner.temp }}/desktop-shots
      - name: Build the installer
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npm run dist
      - name: Check the tag matches package.json
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: pwsh
        run: |
          $v = (Get-Content package.json | ConvertFrom-Json).version
          if ("v$v" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match package.json version $v" }
      - name: Build and publish the release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional code signing (see docs/companion.md): add these as repository secrets to sign the installer.
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      - name: Add a fixed-name copy for the website's download button
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $exe = Get-ChildItem dist -Filter "LevelUp-Life-Setup-*.exe" | Select-Object -First 1
          Copy-Item $exe.FullName dist/LevelUp-Life-Setup.exe
          gh release upload "${{ github.ref_name }}" dist/LevelUp-Life-Setup.exe --clobber
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-installer-and-screenshots
          path: |
            dist/*.exe
            dist/latest.yml
            ${{ runner.temp }}/desktop-shots
          if-no-files-found: ignore
